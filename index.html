<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>自媒体工作台 · 云端看板</title>
<style>
:root{--bg:#0b1220;--card:#151d2e;--line:#243149;--fg:#e6edf7;--dim:#93a4bd;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 48px}
header{margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{color:var(--dim);font-size:11px}
h2{font-size:14px;margin:26px 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em}
h2 small{color:var(--accent);margin-left:8px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.badge{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:999px;padding:1px 8px;font-size:11px}
.plat{background:#1e293b;color:#cbd5e1;border-radius:999px;padding:1px 8px;font-size:11px}
.when{color:var(--dim);font-size:11px;margin-left:auto}
.card h3{font-size:15px;margin:2px 0 4px;line-height:1.45}
.card p{margin:0;color:#c2cfe0;font-size:13px}
.tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tags span{color:#7dd3fc;font-size:11px}
.empty{color:var(--dim);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
footer{margin-top:30px;color:#5b6b85;font-size:11px;text-align:center}
</style></head><body>
<header>
  <h1>自媒体工作台 · 云端看板</h1>
  <div class="sub">快照时间 2026/11/13 20:06:10 · 数据由本机同步</div>
</header>

<div class="stats">
  <div class="stat"><b>0</b><span>内容总数</span></div>
  <div class="stat"><b>0</b><span>已发布</span></div>
  <div class="stat"><b>0</b><span>累计播放</span></div>
  <div class="stat"><b>0</b><span>累计点赞</span></div>
</div>

<section><h2>待发布 / 排期<small>0</small></h2><p class="empty">暂无排期内容</p></section>
<section><h2>写作中<small>0</small></h2><p class="empty">暂无草稿</p></section>
<section><h2>灵感<small>0</small></h2><p class="empty">暂无灵感</p></section>
<section><h2>已发布<small>0</small></h2><p class="empty">还没有发布记录</p></section>

<section><h2>复盘 · 平台分布</h2>
<table><thead><tr><th>平台</th><th class="n">播放</th><th class="n">点赞</th><th class="n">评论</th><th class="n">记录</th></tr></thead><tbody>

</tbody></table></section>

<section><h2>账号</h2>
<table><thead><tr><th>平台</th><th>账号</th><th class="n">粉丝</th></tr></thead><tbody>

</tbody></table></section>

<footer>只读快照 · 编辑请回本机工作台</footer>
</body></html>
