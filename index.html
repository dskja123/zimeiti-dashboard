<meta name="theme-color" content="#0b1220">
<title>自媒体工作台 · 云端看板</title>
<style>
:root{--bg:#0b1220;--card:#151d2e;--line:#243149;--fg:#e6edf7;--dim:#93a4bd;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 48px;max-width:960px;margin:0 auto}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px}
.hero{background:linear-gradient(135deg,#1b2438,#141c2c);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.hero .big{font-size:22px;font-weight:600;line-height:1.35}
.hero .big em{font-style:normal;color:var(--accent)}
.kpis{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.kpi b{display:block;font-size:17px}
.kpi span{color:var(--dim);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px;margin:12px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:18px;line-height:1.2}
.stat span{color:var(--dim);font-size:11px}
.hint{color:#fbbf24;font-size:12px;line-height:1.6;background:#1f1a0e;border:1px solid #3f3413;border-radius:10px;padding:8px 11px;margin:8px 0 0}
h2{font-size:14px;margin:26px 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em}
h2 small{color:var(--accent);margin-left:8px;font-weight:400}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.chart{width:100%;height:200px;display:block}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-label{width:64px;color:#cbd5e1;font-size:13px;flex:none}
.bar-track{flex:1;height:10px;background:#1e293b;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:999px}
.bar-value{width:62px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.badge{background:#1e293b;color:var(--accent);border:1px solid #2b3a55;border-radius:999px;padding:1px 8px;font-size:11px}
.plat{background:#1e293b;color:#cbd5e1;border-radius:999px;padding:1px 8px;font-size:11px}
.when{color:var(--dim);font-size:11px;margin-left:auto}
.card h3{font-size:15px;margin:2px 0 4px;line-height:1.45}
.card p{margin:0;color:#c2cfe0;font-size:13px}
.empty{color:var(--dim);font-size:13px}
footer{margin-top:30px;color:#5b6b85;font-size:11px;text-align:center}
</style></head><body>
